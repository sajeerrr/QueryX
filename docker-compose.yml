services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: queryx-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: queryx-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - hf_cache:/root/.cache/huggingface
      - backend_uploads:/tmp/queryx_uploads
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: queryx-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  qdrant_storage:
  hf_cache:
  backend_uploads:
